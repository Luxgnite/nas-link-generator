<html style="width: 100%; height: 100%;">
<head>
	<link rel="preload" href="https://upload.wikimedia.org/wikipedia/commons/9/92/Loading_icon_cropped.gif" as="image" />
</head>

	<body style="width: 100%; height: 100%; display: flex;  justify-content: center; align-items: center;">
		<img src="https://upload.wikimedia.org/wikipedia/commons/9/92/Loading_icon_cropped.gif" >
	</body>
	<script defer> 
	// A/B Split Test Redirect
	(function splitTest(){
		const r = Math.random() * 100;
		var param = "&roll=" + Math.floor(Math.random() * 100);
		if (document.documentElement.clientWidth < 900) {   param+= "&media=mobile" }
		var query = '';
		if (r <= 50)
		{
			query = "https://tally.so/r/vXYj9d" + "?group=A";
		}
		else{
			query = "https://tally.so/r/vXYj9d" + "?group=B";
		}

		window.location.replace(query + param);
	})();
</script>
</html>
